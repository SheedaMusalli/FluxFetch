appId: com.fluxfetch.app
productName: FluxFetch
afterPack: scripts/verify-packaged-app.cjs
directories:
  buildResources: build
  output: release
extraResources:
  - from: LICENSE
    to: legal/LICENSE
  - from: THIRD-PARTY-MEDIA.md
    to: legal/THIRD-PARTY-MEDIA.md
  - from: third-party-licenses
    to: legal/third-party-licenses
  - from: native-host
    to: browser
    filter: ['FluxFetch.BrowserHost.exe', '*.json', '*.txt']
  - from: extension
    to: extension
  - from: extension-firefox
    to: extension-firefox
  - from: media-tools
    to: media-tools-ffmpeg
    filter: ['ffmpeg.exe', 'av*.dll', 'sw*.dll', 'LICENSE.txt']
files:
  - '!{extension,extension-firefox,native-host,media-tools,e2e,scripts,release,outputs,artifacts,test-results,playwright-report,release-settings-build,Installed,.signing}/**'
  - '!{app-asar-codex,out-codex-*,out-youtube-*,release-codex-*,release-youtube-*}/**'
  - '!app.asar-codex'
  - '!integrations/omnilink/**'
  - '!integrations/net-merge/**'
  - '!resources/net-merge/**'
  - '!resources/torrent/**'
  - '!resources/torrent-engine/**'
  - '!integrations/torrent-engine/**'
  - '!resources/omnilink/**'
  - '!resources/archive-tools/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # koffi is only loaded on Linux (network/deviceBinding.ts) and ships prebuilds for every OS.
  - '!node_modules/koffi/{src,vendor,doc}/**'
  - '!node_modules/koffi/build/koffi/!(linux_x64|linux_arm64)/**'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/icon-dark.png
  - resources/icon.ico
win:
  compression: maximum
  executableName: fluxfetch
  icon: build/icon.ico
  extraResources:
    - from: resources/omnilink
      to: omnilink
    - from: resources/net-merge
      to: net-merge
    - from: resources/archive-tools
      to: archive-tools
    - from: resources/torrent-engine
      to: torrent
      filter: ['**/*', '!**/__pycache__/**', '!**/*.pyi', '!**/pythonw.exe']
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Retain the existing Windows uninstall identity so this release upgrades in place.
  guid: 0c9b690a-2a86-5845-88ba-6628b5cb864e
  # No ${arch} on purpose: one installer holds both x64 and ARM64, and docs/downloads.js reads an
  # installer with no architecture in its name as exactly that. Add one here and update it there.
  artifactName: ${name}-${version}-setup.${ext}
  # Assisted installer instead of one-click, so users can choose the install folder (and drive).
  # One-click always installs to %LOCALAPPDATA%\Programs with no way to change it.
  oneClick: false
  # The custom configuration page owns folder selection.
  allowToChangeInstallationDirectory: false
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createStartMenuShortcut: false
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDownloadsFolderUsageDescription: FluxFetch saves downloaded files to your Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
electronLanguages:
  - en-US
publish:
  provider: generic
  url: https://example.com/auto-updates
