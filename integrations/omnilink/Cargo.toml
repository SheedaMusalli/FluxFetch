[package]
name = "omnilink-tray"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "omnilink_tray"
path = "src/lib.rs"

[[bin]]
name = "omnilink-tray"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
dashmap = "6.1"
log = "0.4"
thiserror = "2.0"
tray-icon = "0.19"
muda = "0.15"
winit = "0.30"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
